root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/air-tui-entrypoint ./cmd/air-tui-entrypoint && go build -o ./tmp/just-talk-plus ./cmd/just-talk-plus"
entrypoint = ["./tmp/air-tui-entrypoint", "./tmp/just-talk-plus"]
delay = 500
rerun = false
exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git", "build"]
exclude_regex = ["_test.go"]
include_ext = ["go", "toml"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
main_only = true

[screen]
clear_on_rebuild = false
keep_scroll = true

[misc]
clean_on_exit = false
