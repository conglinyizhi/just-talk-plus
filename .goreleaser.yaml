version: 2

project_name: just-talk-plus

builds:
  - id: linux-amd64
    main: ./cmd/just-talk-plus
    binary: just-talk-plus
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED={{ .Env.CGO_ENABLED }}
    flags:
      - -trimpath
    ldflags:
      - -s -w
    skip: '{{ ne .Env.RELEASE_TARGET "linux-amd64" }}'

archives:
  - name_template: "just-talk-plus_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - README.en.md
      - CHANGELOG.md      # README 里链接到它，缺了就是断链
      - LICENSE
      - NOTICE            # GPL-3.0 分发必须随附的归属与修改声明
      - THIRD_PARTY_NOTICES # 第三方组件许可
      - docs/screenshot-tui.png # README.en 引用

checksum:
  disable: true

changelog:
  disable: true

release:
  disable: true
