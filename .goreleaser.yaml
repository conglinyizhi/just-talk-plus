version: 2

project_name: just-talk-plus

builds:
  - id: linux-amd64
    main: ./cmd/just-talk-plus
    binary: just-talk-plus
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED={{ .Env.CGO_ENABLED }}
    flags:
      - -trimpath
    ldflags:
      - -s -w
    skip: '{{ ne .Env.RELEASE_TARGET "linux-amd64" }}'

archives:
  - name_template: "just-talk-plus_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - README.en.md
      - LICENSE

checksum:
  disable: true

changelog:
  disable: true

release:
  disable: true
